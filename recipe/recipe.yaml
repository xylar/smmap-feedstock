schema_version: 1

context:
  name: smmap
  version: "6.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/smmap-${{ version }}.tar.gz
  sha256: 8d79028ea6cc131da5eab099a5d95a998d43c6779956fffe3b455040911076da

build:
  number: 4
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - smmap
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A pure git implementation of a sliding window memory map manager.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/gitpython-developers/smmap
  repository: https://github.com/gitpython-developers/smmap
  documentation: https://pythonhosted.org/smmap/

extra:
  recipe-maintainers:
    - xylar
    - pelson
    - ocefpaf
